name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p TapMap/app/src/main/java/com/tapmap TapMap/app/src/main/res/xml TapMap/app/src/main/res/values
          cd TapMap
          cat > settings.gradle.kts <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FreestyleLauncher"
          include(":app")
          E
          cat > build.gradle.kts <<'E'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          E
          cat > gradle.properties <<'E'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          E
          cat > app/build.gradle.kts <<'E'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.tapmap"
              compileSdk = 34
              defaultConfig { applicationId = "com.tapmap"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          E
          cat > app/src/main/res/values/strings.xml <<'E'
          <resources>
              <string name="app_name">Freestyle Launcher</string>
              <string name="svc_desc">Maps keyboard and gamepad buttons to screen taps.</string>
          </resources>
          E
          cat > app/src/main/res/xml/service_config.xml <<'E'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/svc_desc" />
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".MapService" android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/service_config" />
                  </service>
              </application>
          </manifest>
          E
          cat > app/src/main/java/com/tapmap/MapService.kt <<'E'
          package com.tapmap

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          data class M(val x: Float, val y: Float, val mode: String) // mode: tap | turbo

          class MapService : AccessibilityService() {
              companion object { var inst: MapService? = null }

              private val h = Handler(Looper.getMainLooper())
              private val maps = HashMap<Int, M>()
              private val turbo = HashMap<Int, Runnable>()
              private var pending: M? = null

              override fun onServiceConnected() { inst = this; load() }
              override fun onDestroy() { inst = null; super.onDestroy() }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onKeyEvent(e: KeyEvent): Boolean {
                  val k = e.keyCode
                  pending?.let {
                      if (e.action == KeyEvent.ACTION_DOWN) {
                          maps[k] = it; pending = null; save()
                          toast("Saved: ${KeyEvent.keyCodeToString(k)}")
                      }
                      return true
                  }
                  val m = maps[k] ?: return false
                  if (e.action == KeyEvent.ACTION_DOWN && e.repeatCount == 0) {
                      if (m.mode == "turbo") {
                          val r = object : Runnable { override fun run() { tap(m.x, m.y); h.postDelayed(this, 60) } }
                          turbo[k] = r; r.run()
                      } else tap(m.x, m.y)
                  } else if (e.action == KeyEvent.ACTION_UP) turbo.remove(k)?.let { h.removeCallbacks(it) }
                  return true
              }

              private fun tap(x: Float, y: Float) {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 40)).build()
                  dispatchGesture(g, null, null)
              }

              /** Shows a dim overlay; the next touch picks the target point, then the next key press binds to it. */
              fun pick(mode: String) {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val v = object : View(this) {
                      override fun onTouchEvent(ev: MotionEvent): Boolean {
                          if (ev.action == MotionEvent.ACTION_DOWN) {
                              pending = M(ev.rawX, ev.rawY, mode); wm.removeView(this)
                              toast("Now press a keyboard/gamepad button")
                          }
                          return true
                      }
                  }
                  v.setBackgroundColor(0x66000000)
                  val lp = WindowManager.LayoutParams(-1, -1, WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT)
                  wm.addView(v, lp)
                  toast("Tap where the button should press")
              }

              fun clear() { maps.clear(); save() }
              fun count() = maps.size

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              private fun prefs() = getSharedPreferences("maps", MODE_PRIVATE)
              private fun save() = prefs().edit().putString("d", maps.entries.joinToString(";") { "${it.key},${it.value.x},${it.value.y},${it.value.mode}" }).apply()
              private fun load() {
                  maps.clear()
                  prefs().getString("d", "")!!.split(";").filter { it.isNotBlank() }.forEach {
                      val p = it.split(","); maps[p[0].toInt()] = M(p[1].toFloat(), p[2].toFloat(), p[3])
                  }
              }
          }
          E
          cat > app/src/main/java/com/tapmap/MainActivity.kt <<'E'
          package com.tapmap

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  root.addView(TextView(this).apply {
                      text = "Freestyle Launcher\n1) Enable the Freestyle Launcher accessibility service.\n2) Tap an Add button, switch to your game within 4 seconds, touch the screen point, then press a key/gamepad button."
                      textSize = 16f; gravity = Gravity.START
                  })
                  fun btn(t: String, f: () -> Unit) = root.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  fun add(mode: String) {
                      val s = MapService.inst
                      if (s == null) { Toast.makeText(this, "Enable the service first", Toast.LENGTH_SHORT).show(); return }
                      Handler(Looper.getMainLooper()).postDelayed({ s.pick(mode) }, 4000)
                      moveTaskToBack(true)
                  }
                  btn("Enable accessibility service") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  btn("Add TAP mapping") { add("tap") }
                  btn("Add TURBO (auto-repeat) mapping") { add("turbo") }
                  btn("Clear all mappings") { MapService.inst?.clear() }
                  setContentView(root)
              }
          }
          E
      - name: Set app icon
        run: |
          IMG=$(ls *.jpg *.jpeg *.png 2>/dev/null | head -n 1 || true)
          if [ -n "$IMG" ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick >/dev/null
            mkdir -p TapMap/app/src/main/res/mipmap-xxhdpi
            convert "$IMG" -resize 144x144^ -gravity center -extent 144x144 TapMap/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          else
            sed -i 's/android:icon="@mipmap\/ic_launcher" //' TapMap/app/src/main/AndroidManifest.xml
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
        working-directory: TapMap
      - uses: actions/upload-artifact@v4
        with:
          name: Freestyle-Launcher-apk
          path: TapMap/app/build/outputs/apk/debug/app-debug.apk
